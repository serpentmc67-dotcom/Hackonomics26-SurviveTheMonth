<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Bar & Work Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Nunito', sans-serif;
    height: 100vh;
    background: linear-gradient(160deg, #f0f4f8 0%, #cfd8dc 100%);
    overflow: hidden;
  }

  /* ── Status area (bottom-left) ── */
  .status-area {
    position: fixed;
    bottom: 20px;
    left: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 33vw;
    max-width: 500px;
    z-index: 100;
  }

  /* Food bar */
  .bar-wrapper {
    background: #f3e5d0;
    border-radius: 24px;
    padding: 8px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    box-shadow: inset 0 2px 6px rgba(0,0,0,0.15);
  }
  .bar-label {
    font-family: 'Fredoka One', cursive;
    font-size: 20px;
    color: #ff9a42;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .bar-track {
    background: rgba(0,0,0,0.12);
    height: 36px;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: inset 0 2px 4px rgba(0,0,0,0.15);
  }
  .bar-fill {
    height: 100%;
    width: 100%;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding-right: 14px;
    color: #fff;
    font-weight: 600;
    font-family: 'Fredoka One', cursive;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
    transition: width 0.5s ease-in-out;
    background: linear-gradient(90deg, #ffb971, #ff8a5c);
  }

  /* Work button — takes up full width where all 3 buttons used to be */
  .work-btn {
    width: 100%;
    padding: 18px 0;
    background: linear-gradient(135deg, #ff9a42, #ff6b00);
    border: none;
    border-radius: 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 26px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,107,0,0.4), inset 0 1px 0 rgba(255,255,255,0.2);
    transition: transform 0.12s, box-shadow 0.12s;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }
  .work-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 28px rgba(255,107,0,0.5), inset 0 1px 0 rgba(255,255,255,0.2);
  }
  .work-btn:active {
    transform: translateY(1px);
    box-shadow: 0 3px 10px rgba(255,107,0,0.3);
  }

  /* Score display */
  .score-display {
    background: rgba(255,154,66,0.12);
    border: 1.5px solid rgba(255,154,66,0.3);
    border-radius: 16px;
    padding: 8px 16px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .score-label {
    font-family: 'Fredoka One', cursive;
    font-size: 14px;
    color: rgba(255,154,66,0.7);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .score-value {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #ff9a42;
  }
  .score-timer {
    font-size: 12px;
    color: rgba(255,154,66,0.5);
    font-family: 'Nunito', sans-serif;
  }

  /* ════════════════════════════════════════════
     WORK PANEL — Full-screen overlay
  ════════════════════════════════════════════ */
  #work-panel {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 500;
    background: #06061a;
    flex-direction: column;
    overflow: hidden;
  }
  #work-panel.open { display: flex; }

  /* Panel top bar */
  .wp-topbar {
    background: rgba(255,154,66,0.06);
    border-bottom: 1px solid rgba(255,154,66,0.15);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .wp-title {
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #ff9a42;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .wp-score-pill {
    background: rgba(255,154,66,0.12);
    border: 1.5px solid rgba(255,154,66,0.3);
    border-radius: 30px;
    padding: 6px 20px;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: #ff9a42;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .wp-score-delta {
    font-size: 13px;
    color: #81c784;
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .wp-score-delta.show { opacity: 1; }
  .wp-close-btn {
    background: rgba(229,57,53,0.1);
    border: 1.5px solid rgba(229,57,53,0.25);
    border-radius: 12px;
    padding: 8px 18px;
    font-family: 'Fredoka One', cursive;
    font-size: 14px;
    color: #ef9a9a;
    cursor: pointer;
    transition: all 0.18s;
  }
  .wp-close-btn:hover { background: #e53935; color: #fff; border-color: #e53935; }

  /* Category/Jeopardy board */
  .jeopardy-board {
    flex: 1;
    overflow-y: auto;
    padding: 20px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .board-subtitle {
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    color: rgba(255,154,66,0.4);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .jeopardy-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
    flex: 1;
  }

  /* Category headers */
  .cat-header {
    background: linear-gradient(135deg, #ff9a42, #ff6b00);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    color: #fff;
    line-height: 1.2;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 60px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.3);
    letter-spacing: 0.3px;
  }

  /* Question tiles */
  .q-tile {
    background: rgba(255,154,66,0.07);
    border: 1.5px solid rgba(255,154,66,0.18);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka One', cursive;
    font-size: 22px;
    color: #ffb347;
    cursor: pointer;
    transition: all 0.18s;
    min-height: 64px;
    position: relative;
    overflow: hidden;
  }
  .q-tile:hover:not(.answered):not(.disabled) {
    background: rgba(255,154,66,0.15);
    border-color: rgba(255,154,66,0.5);
    transform: scale(1.03);
    box-shadow: 0 4px 16px rgba(255,107,0,0.25);
  }
  .q-tile.answered {
    background: rgba(255,255,255,0.02);
    border-color: rgba(255,255,255,0.05);
    color: rgba(255,255,255,0.1);
    cursor: default;
  }
  .q-tile.answered::after {
    content: '✓';
    position: absolute;
    font-size: 18px;
    color: rgba(129,199,132,0.3);
  }
  .q-tile.wrong-answered {
    background: rgba(229,57,53,0.04);
    border-color: rgba(229,57,53,0.1);
    color: rgba(255,100,100,0.15);
    cursor: default;
  }
  .q-tile.wrong-answered::after {
    content: '✗';
    position: absolute;
    font-size: 18px;
    color: rgba(229,57,53,0.25);
  }

  /* ── Question modal ── */
  #q-modal {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 600;
    background: rgba(0,0,0,0.85);
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  #q-modal.open { display: flex; }

  .q-modal-card {
    background: #0c0c2a;
    border: 1.5px solid rgba(255,154,66,0.3);
    border-radius: 24px;
    padding: 40px 44px;
    max-width: 700px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.8), inset 0 1px 0 rgba(255,154,66,0.08);
    position: relative;
    animation: modalIn 0.22s cubic-bezier(.4,2,.6,1);
  }
  @keyframes modalIn {
    from { opacity: 0; transform: scale(0.92) translateY(20px); }
    to   { opacity: 1; transform: scale(1) translateY(0); }
  }

  .q-modal-cat {
    font-family: 'Fredoka One', cursive;
    font-size: 11px;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    color: rgba(255,154,66,0.5);
    margin-bottom: 6px;
  }
  .q-modal-pts {
    font-family: 'Fredoka One', cursive;
    font-size: 13px;
    color: #ffb347;
    margin-bottom: 20px;
  }
  .q-modal-question {
    font-family: 'Fredoka One', cursive;
    font-size: clamp(18px, 2.5vw, 26px);
    color: #fff;
    line-height: 1.35;
    margin-bottom: 28px;
  }

  .q-answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-bottom: 20px;
  }
  .q-answer-btn {
    background: rgba(255,255,255,0.04);
    border: 1.5px solid rgba(255,154,66,0.2);
    border-radius: 14px;
    padding: 14px 18px;
    font-family: 'Nunito', sans-serif;
    font-size: 15px;
    font-weight: 700;
    color: rgba(255,255,255,0.8);
    cursor: pointer;
    transition: all 0.15s;
    text-align: left;
    line-height: 1.3;
  }
  .q-answer-btn:hover:not(:disabled) {
    background: rgba(255,154,66,0.1);
    border-color: rgba(255,154,66,0.45);
    color: #fff;
    transform: translateY(-1px);
  }
  .q-answer-btn.correct {
    background: rgba(76,175,80,0.2) !important;
    border-color: #66bb6a !important;
    color: #a5d6a7 !important;
  }
  .q-answer-btn.wrong {
    background: rgba(229,57,53,0.15) !important;
    border-color: #e53935 !important;
    color: #ef9a9a !important;
  }
  .q-answer-btn:disabled { cursor: default; }

  .q-feedback {
    min-height: 36px;
    text-align: center;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: #81c784;
    margin-bottom: 12px;
    transition: opacity 0.3s;
  }
  .q-feedback.wrong-fb { color: #ef9a9a; }

  .q-next-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, #ff9a42, #ff6b00);
    border: none;
    border-radius: 14px;
    font-family: 'Fredoka One', cursive;
    font-size: 18px;
    color: #fff;
    cursor: pointer;
    box-shadow: 0 4px 16px rgba(255,107,0,0.35);
    transition: all 0.15s;
    display: none;
  }
  .q-next-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(255,107,0,0.45); }
  .q-next-btn.visible { display: block; }

  /* Progress bar at top of work panel */
  .wp-progress-bar {
    height: 4px;
    background: rgba(255,154,66,0.12);
    flex-shrink: 0;
  }
  .wp-progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #ff9a42, #ff6b00);
    transition: width 0.4s ease;
    border-radius: 0 2px 2px 0;
  }

  /* Scrollbar styling */
  .jeopardy-board::-webkit-scrollbar { width: 6px; }
  .jeopardy-board::-webkit-scrollbar-track { background: transparent; }
  .jeopardy-board::-webkit-scrollbar-thumb { background: rgba(255,154,66,0.2); border-radius: 3px; }
</style>
</head>
<body>

<!-- ── Status area (bottom-left) ── -->
<div class="status-area">
  <!-- Score display -->
  <div class="score-display">
    <div>
      <div class="score-label">⭐ Score</div>
      <div class="score-timer" id="timer-display">Time: 0:00</div>
    </div>
    <div class="score-value" id="score-display">0</div>
  </div>

  <!-- Food bar -->
  <div class="bar-wrapper">
    <div class="bar-label">🍕 FOOD</div>
    <div class="bar-track">
      <div class="bar-fill" id="foodBar">
        <span class="bar-text">67%</span>
      </div>
    </div>
  </div>

  <!-- Work button — full width -->
  <button class="work-btn" onclick="openWorkPanel()">
    💼 WORK
  </button>
</div>

<!-- ════════════════════════════════════════
     WORK PANEL
════════════════════════════════════════ -->
<div id="work-panel">
  <div class="wp-topbar">
    <div class="wp-title">💼 Work Shift</div>
    <div class="wp-score-pill">
      ⭐ <span id="wp-score">0</span>
      <span class="wp-score-delta" id="wp-score-delta">+0</span>
    </div>
    <button class="wp-close-btn" onclick="closeWorkPanel()">✕ Leave</button>
  </div>

  <div class="wp-progress-bar">
    <div class="wp-progress-fill" id="wp-progress" style="width:0%"></div>
  </div>

  <div class="jeopardy-board">
    <div class="board-subtitle">📋 Select a question to earn points</div>
    <div class="jeopardy-grid" id="jeopardy-grid">
      <!-- Filled by JS -->
    </div>
  </div>
</div>

<!-- ════════════════════════════════════════
     QUESTION MODAL
════════════════════════════════════════ -->
<div id="q-modal">
  <div class="q-modal-card">
    <div class="q-modal-cat" id="q-cat">Category</div>
    <div class="q-modal-pts" id="q-pts">100 pts</div>
    <div class="q-modal-question" id="q-question">Question text here</div>
    <div class="q-answers" id="q-answers"></div>
    <div class="q-feedback" id="q-feedback"></div>
    <button class="q-next-btn" id="q-next-btn" onclick="closeQuestion()">Continue →</button>
  </div>
</div>

<script>
// ── Scoring & session state ──────────────────────────────────────
const STATE = {
  playerId:   parseInt(sessionStorage.getItem('player_id') || '0'),
  sessionId:  null,
  startTime:  null,
  score:      parseInt(sessionStorage.getItem('game_score') || '0'),
  timerInt:   null,
};

// ── Score helpers ────────────────────────────────────────────────
function updateScoreDisplay() {
  document.getElementById('score-display').textContent = STATE.score;
  document.getElementById('wp-score').textContent = STATE.score;
  sessionStorage.setItem('game_score', STATE.score);
}

async function addScoreAPI(delta, reason) {
  if (!STATE.playerId) return;
  try {
    await fetch('/api/score/add', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: STATE.playerId, delta, reason })
    });
  } catch(e) { /* offline / no server */ }
}

function showScoreDelta(delta) {
  const el = document.getElementById('wp-score-delta');
  el.textContent = (delta > 0 ? '+' : '') + delta;
  el.style.color = delta > 0 ? '#81c784' : '#ef9a9a';
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 1800);
}

// ── Timer ────────────────────────────────────────────────────────
function startTimer() {
  if (STATE.timerInt) return;
  STATE.startTime = Date.now();
  STATE.timerInt = setInterval(() => {
    const secs = Math.floor((Date.now() - STATE.startTime) / 1000);
    const m = Math.floor(secs / 60);
    const s = secs % 60;
    document.getElementById('timer-display').textContent = `Time: ${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function stopTimer() {
  if (STATE.timerInt) { clearInterval(STATE.timerInt); STATE.timerInt = null; }
}

async function startSession() {
  startTimer();
  if (!STATE.playerId) return;
  try {
    const res  = await fetch('/api/session/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: STATE.playerId })
    });
    const data = await res.json();
    if (data.ok) STATE.sessionId = data.session_id;
  } catch(e) {}
}

async function endSession() {
  stopTimer();
  if (!STATE.playerId || !STATE.sessionId || !STATE.startTime) return;
  const seconds = Math.floor((Date.now() - STATE.startTime) / 1000);
  try {
    await fetch('/api/session/end', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ player_id: STATE.playerId, session_id: STATE.sessionId, seconds })
    });
  } catch(e) {}
  STATE.sessionId = null;
}

// Save score on page unload
window.addEventListener('beforeunload', () => { endSession(); });

// Start session on load
startSession();
updateScoreDisplay();

// ── Food bar ─────────────────────────────────────────────────────
function updateBar(barEl, value) {
  barEl.style.width = value + '%';
  barEl.querySelector('.bar-text').textContent = value + '%';
}
const foodBar = document.getElementById('foodBar');
updateBar(foodBar, 67);

// ── Jeopardy questions data ───────────────────────────────────────

  { name: "Budgeting Basics",      emoji: "💰" },
  { name: "Credit & Debt",         emoji: "💳" },
  { name: "Saving & Investing",    emoji: "📈" },

    { pts: 500, q: "The concept of 'lifestyle creep' means...",

  "Money Mindset": [
    { pts: 100, q: "What is an 'opportunity cost'?",
      a: ["The price of a business opportunity", "The value of the next best alternative you give up", "Interest lost on a savings account", "The cost of a job training program"],
      correct: 1 },

// ── Board state ──────────────────────────────────────────────────
// Persist boardState across panel opens via sessionStorage
function loadBoardState() {
  try { return JSON.parse(sessionStorage.getItem('jeopardy_boardState') || '{}'); } catch(e) { return {}; }
}
function saveBoardState() {
  sessionStorage.setItem('jeopardy_boardState', JSON.stringify(boardState));
}
const boardState = loadBoardState(); // key: "catIdx-ptIdx", value: "answered"|"wrong"
let currentQ = null;   // { catName, pts, qIdx }

// ── Work panel open/close ────────────────────────────────────────
function openWorkPanel() {
  document.getElementById('work-panel').classList.add('open');
  renderBoard();
  updateProgress();
}

function closeWorkPanel() {
  document.getElementById('work-panel').classList.remove('open');
}

// ── Build the Jeopardy grid ──────────────────────────────────────
function renderBoard() {
  const grid = document.getElementById('jeopardy-grid');
  grid.innerHTML = '';

  // Header row
  CATEGORIES.forEach(cat => {
    const h = document.createElement('div');
    h.className = 'cat-header';
    h.innerHTML = `<span>${cat.emoji}<br>${cat.name}</span>`;
    grid.appendChild(h);
  });

  // 5 rows of questions
  POINT_VALUES.forEach((pts, ptIdx) => {
    CATEGORIES.forEach((cat, catIdx) => {
      const key = `${catIdx}-${ptIdx}`;
      const tile = document.createElement('div');
      tile.className = 'q-tile';
      tile.id = `tile-${key}`;
      tile.textContent = `$${pts}`;

      if (boardState[key] === 'answered') {
        tile.classList.add('answered');
      } else if (boardState[key] === 'wrong') {
        tile.classList.add('wrong-answered');
      } else {
        tile.addEventListener('click', () => openQuestion(catIdx, ptIdx));
      }
      grid.appendChild(tile);
    });
  });
}

function updateProgress() {
  const total    = CATEGORIES.length * POINT_VALUES.length;
  const answered = Object.values(boardState).filter(v => v === 'answered' || v === 'wrong').length;
  document.getElementById('wp-progress').style.width = `${(answered / total) * 100}%`;
}

// ── Question modal ────────────────────────────────────────────────
function openQuestion(catIdx, ptIdx) {
  const cat  = CATEGORIES[catIdx];
  const data = QUESTIONS[cat.name][ptIdx];
  currentQ   = { catIdx, ptIdx, pts: data.pts, correct: data.correct };

  document.getElementById('q-cat').textContent      = `${cat.emoji} ${cat.name}`;
  document.getElementById('q-pts').textContent      = `$${data.pts}`;
  document.getElementById('q-question').textContent = data.q;
  document.getElementById('q-feedback').textContent = '';
  document.getElementById('q-feedback').className   = 'q-feedback';
  document.getElementById('q-next-btn').classList.remove('visible');

  const answersEl = document.getElementById('q-answers');
  answersEl.innerHTML = data.a.map((ans, i) => `
    <button class="q-answer-btn" onclick="selectAnswer(${i})">${['A','B','C','D'][i]}. ${ans}</button>
  `).join('');

  document.getElementById('q-modal').classList.add('open');
}

function selectAnswer(idx) {
  const { catIdx, ptIdx, pts, correct } = currentQ;
  const btns = document.querySelectorAll('.q-answer-btn');
  btns.forEach(b => b.disabled = true);

  const key = `${catIdx}-${ptIdx}`;

  if (idx === correct) {
    btns[idx].classList.add('correct');
    document.getElementById('q-feedback').textContent = `✓ Correct! +${pts} pts`;
    boardState[key] = 'answered';
    saveBoardState();
    STATE.score += pts;
    updateScoreDisplay();
    showScoreDelta(pts);
    addScoreAPI(pts, `Jeopardy: ${CATEGORIES[catIdx].name} $${pts}`);
  } else {
    btns[idx].classList.add('wrong');
    btns[correct].classList.add('correct');
    const penalty = Math.floor(pts / 2);
    document.getElementById('q-feedback').textContent = `✗ Wrong! −${penalty} pts`;
    document.getElementById('q-feedback').classList.add('wrong-fb');
    boardState[key] = 'wrong';
    saveBoardState();
    STATE.score = Math.max(0, STATE.score - penalty);
    updateScoreDisplay();
    showScoreDelta(-penalty);
    addScoreAPI(-penalty, `Jeopardy wrong: ${CATEGORIES[catIdx].name} $${pts}`);
  }

  document.getElementById('q-next-btn').classList.add('visible');
  updateProgress();

  // Refresh tile in grid
  const tile = document.getElementById(`tile-${key}`);
  if (tile) {
    tile.classList.remove('q-tile');
    if (boardState[key] === 'answered') {
      tile.classList.add('answered');
    } else {
      tile.classList.add('wrong-answered');
    }
    tile.replaceWith(tile.cloneNode(true)); // remove event listener
  }
}

function closeQuestion() {
  document.getElementById('q-modal').classList.remove('open');
  currentQ = null;
}

// Close modal on backdrop click
document.getElementById('q-modal').addEventListener('click', function(e) {
  if (e.target === this && document.getElementById('q-next-btn').classList.contains('visible')) {
    closeQuestion();
  }
});
</script>
