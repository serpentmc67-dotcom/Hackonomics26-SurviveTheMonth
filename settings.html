<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Survive the Month – Settings</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(160deg, #f7c97a 0%, #f5a95a 40%, #f07d4a 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
      padding: 24px 16px 32px;
      overflow-y: auto;
      position: relative;
    }
    .cards-row {
      display: flex;
      flex-direction: row;
      gap: 20px;
      align-items: flex-start;
      justify-content: center;
      width: 100%;
      max-width: 1300px;
      flex-wrap: nowrap;
      position: relative;
      z-index: 1;
    }
    @media (max-width: 860px) {
      .cards-row { flex-wrap: wrap; }
    }
    canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .card {
      position: relative; z-index: 1;
      background: rgba(255,255,255,0.18);
      border: 3px solid #2a2060;
      border-radius: 24px;
      padding: 36px 44px;
      text-align: left;
      box-shadow: 6px 6px 0 #2a2060;
      width: 100%;
      max-width: 480px;
    }
    h1 { font-family:'Fredoka One',cursive; font-size:2.4rem; color:#fff; text-shadow:3px 3px 0 #c05a20; margin-bottom:24px; text-align:center; }
    .setting {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .setting label { font-family:'Fredoka One',cursive; font-size:1.2rem; color:#2a2060; }
    .toggle { position:relative; width:54px; height:28px; }
    .toggle input { opacity:0; width:0; height:0; }
    .slider {
      position:absolute; cursor:pointer; inset:0;
      background:#c8b860; border-radius:28px;
      border: 2px solid #2a2060;
      transition:.3s;
    }
    .slider:before {
      content:''; position:absolute;
      height:20px; width:20px; left:3px; bottom:2px;
      background:#fff; border-radius:50%;
      border:2px solid #2a2060;
      transition:.3s;
    }
    input:checked + .slider { background:#f5c842; }
    input:checked + .slider:before { transform:translateX(25px); }
    input[type=range] {
      -webkit-appearance: none;
      appearance: none;
      width:130px; height:8px;
      border-radius:8px; background:#c8b860; border:2px solid #2a2060; outline:none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width:20px; height:20px;
      border-radius:50%; background:#f5c842; border:2px solid #2a2060; cursor:pointer;
    }
    .diff-select {
      font-family:'Fredoka One',cursive; font-size:1rem;
      background:#f5c842; border:2px solid #2a2060; border-radius:12px;
      padding:6px 12px; color:#2a2060; cursor:pointer; outline:none;
    }
    .diff-desc {
      font-size:12px; color:#2a2060; opacity:0.7;
      margin-top:-14px; margin-bottom:18px;
      padding: 8px 12px; background:rgba(255,255,255,0.25);
      border-radius:10px; border-left:3px solid #2a2060;
      font-family:'Nunito',sans-serif;
    }
    /* Archetype cards */
    .archetype-card {
      display:flex; align-items:center; gap:14px;
      padding:14px 18px; border-radius:16px;
      border:2.5px solid rgba(42,32,96,0.2);
      background:rgba(255,255,255,0.25);
      cursor:pointer; transition:all 0.18s;
      margin-bottom:0;
    }
    .archetype-card:hover { background:rgba(255,255,255,0.45); border-color:#2a2060; }
    .archetype-card.selected { background:#f5c842; border-color:#2a2060; box-shadow:3px 3px 0 #2a2060; }
    .arch-emoji { font-size:36px; flex-shrink:0; }
    .arch-name  { font-family:'Fredoka One',cursive; font-size:17px; color:#2a2060; }
    .arch-desc  { font-size:12px; color:#2a2060; opacity:0.7; margin-top:2px; }
    .arch-stats { display:flex; gap:10px; margin-top:6px; font-size:11px; font-family:'Fredoka One',cursive; flex-wrap:wrap; }
    .stat-money  { color:#2a7a2a; }
    .stat-food   { color:#b45309; }
    .stat-sanity { color:#7c3aed; }
    .stat-pay    { color:#0d9488; }
    .section-title { font-family:'Fredoka One',cursive; font-size:1.9rem; color:#fff; text-shadow:3px 3px 0 #c05a20; text-align:center; margin-bottom:6px; }
    .section-sub   { font-size:13px; color:#2a2060; opacity:0.8; text-align:center; margin-bottom:18px; font-family:'Nunito',sans-serif; }
    .back-btn {
      position:relative; z-index:1;
      display:inline-block; padding:14px 40px;
      background:#f5c842; border:3px solid #2a2060; border-radius:60px;
      font-family:'Fredoka One',cursive; font-size:1.4rem; color:#2a2060;
      text-decoration:none; box-shadow:4px 4px 0 #2a2060;
      transition:transform .12s, box-shadow .12s;
    }
    .back-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 #2a2060; }
    .back-btn:active { transform:translate(2px,2px); box-shadow:2px 2px 0 #2a2060; }
  </style>
</head>
<body>
  <canvas id="rain"></canvas>

  <div class="cards-row">
  <!-- ── Audio / Visual Settings ── -->
  <div class="card" style="flex:1;min-width:300px;max-width:460px;">
    <h1>⚙️ Settings</h1>
    <div class="setting">
      <label>🔊 Music</label>
      <label class="toggle"><input type="checkbox" id="toggle-music" checked/><span class="slider"></span></label>
    </div>
    <div class="setting">
      <label>🔔 Sound FX</label>
      <label class="toggle"><input type="checkbox" id="toggle-sfx" checked/><span class="slider"></span></label>
    </div>
    <div class="setting">
      <label>🌧️ Rain FX</label>
      <label class="toggle"><input type="checkbox" id="toggle-rain" checked/><span class="slider"></span></label>
    </div>
    <div class="setting">
      <label>🔈 Volume</label>
      <input type="range" id="volume-slider" min="0" max="100" value="70"/>
    </div>
    <div class="setting">
      <label>⚡ Difficulty</label>
      <select id="difficulty-select" class="diff-select">
        <option value="easy">😌 Easy</option>
        <option value="normal" selected>⚡ Normal</option>
        <option value="hard">💀 Hard</option>
      </select>
    </div>
    <div class="diff-desc" id="diff-desc"></div>
  </div>

  <!-- ── Character Archetype ── -->
  <div class="card" style="flex:2;min-width:400px;max-width:720px;">
    <div class="section-title">🧑 Your Character</div>
    <div class="section-sub">Each archetype starts with different stats. Your choice carries into the game!</div>
    <div id="archetype-list" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;"></div>
  </div>
  </div><!-- end cards-row -->

  <a class="back-btn" href="index.html">← Back to Menu</a>

  <script>
    // ── Rain ──
    const c = document.getElementById('rain'), ctx = c.getContext('2d');
    function resize(){ c.width=innerWidth; c.height=innerHeight; } resize();
    window.addEventListener('resize', resize);
    const drops = Array.from({length:180},()=>({x:Math.random()*innerWidth*1.4-100,y:Math.random()*innerHeight,len:12+Math.random()*16,speed:5+Math.random()*7,op:0.15+Math.random()*0.25}));
    const dx=Math.sin(Math.PI/5),dy=Math.cos(Math.PI/5);
    let rainEnabled = true;
    function draw(){ if(!rainEnabled){requestAnimationFrame(draw);return;} ctx.clearRect(0,0,c.width,c.height); for(const d of drops){ ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-d.len*dx,d.y-d.len*dy);ctx.strokeStyle=`rgba(180,220,255,${d.op})`;ctx.lineWidth=1.2;ctx.lineCap='round';ctx.stroke();d.x+=d.speed*dx;d.y+=d.speed*dy;if(d.y>c.height+20||d.x>c.width+20){d.x=Math.random()*c.width-100;d.y=-20;}} requestAnimationFrame(draw); }
    draw();

    // ── Load saved settings ──
    const getB = k => (localStorage.getItem(k) ?? 'true') === 'true';
    const getN = (k, def) => parseFloat(localStorage.getItem(k) ?? def);

    const musicToggle  = document.getElementById('toggle-music');
    const sfxToggle    = document.getElementById('toggle-sfx');
    const rainToggle   = document.getElementById('toggle-rain');
    const volSlider    = document.getElementById('volume-slider');

    musicToggle.checked = getB('stm_music');
    sfxToggle.checked   = getB('stm_sfx');
    rainToggle.checked  = getB('stm_rain');
    volSlider.value     = getN('stm_volume', 70);
    rainEnabled         = rainToggle.checked;

    musicToggle.addEventListener('change', e => {
      localStorage.setItem('stm_music', e.target.checked);
      playSfx('click');
    });
    sfxToggle.addEventListener('change', e => {
      localStorage.setItem('stm_sfx', e.target.checked);
      if(e.target.checked) playSfx('click');
    });
    rainToggle.addEventListener('change', e => {
      localStorage.setItem('stm_rain', e.target.checked);
      rainEnabled = e.target.checked;
      if(!e.target.checked) ctx.clearRect(0,0,c.width,c.height);
      playSfx('click');
    });
    volSlider.addEventListener('input', e => {
      localStorage.setItem('stm_volume', e.target.value);
    });

    // ── Tiny SFX engine for settings page ──
    function playSfx(type) {
      if(localStorage.getItem('stm_sfx') === 'false') return;
      const vol = parseFloat(localStorage.getItem('stm_volume') ?? 70) / 100;
      try {
        const ac = new (window.AudioContext || window.webkitAudioContext)();
        const g  = ac.createGain(); g.gain.value = vol * 0.4; g.connect(ac.destination);
        const o  = ac.createOscillator();
        if(type === 'click') { o.frequency.value = 880; o.type = 'sine'; g.gain.setTargetAtTime(0,ac.currentTime+0.05,0.02); }
        o.connect(g); o.start(); o.stop(ac.currentTime + 0.08);
      } catch(e){}
    }

    // ── Difficulty ──
    const DIFF_DESCS = {
      easy:   '😌 Easy — More starting money, slower decay. Great for first-time players.',
      normal: '⚡ Normal — Balanced challenge. The intended experience.',
      hard:   '💀 Hard — Less money, faster food & sanity drain. For veterans only.'
    };

    const diffSel  = document.getElementById('difficulty-select');
    const diffDesc = document.getElementById('diff-desc');
    const savedDiff = localStorage.getItem('stm_difficulty') || 'normal';
    diffSel.value = savedDiff;
    diffDesc.textContent = DIFF_DESCS[savedDiff];

    diffSel.addEventListener('change', e => {
      localStorage.setItem('stm_difficulty', e.target.value);
      diffDesc.textContent = DIFF_DESCS[e.target.value];
      playSfx('click');
    });

    // ── Archetypes ──
    const ARCHETYPES = [
      { id:'grad',     emoji:'🎓', name:'Recent Grad',     money:300, food:80,  sanity:90,  salaryMult:1.0, desc:'Just moved out. Tight budget, student loans looming. Classic mode.' },
      { id:'parent',   emoji:'👶', name:'Single Parent',   money:250, food:90,  sanity:70,  salaryMult:1.1, desc:'Slightly higher pay but sanity drains faster. Every dollar counts.' },
      { id:'student',  emoji:'📚', name:'College Student', money:150, food:100, sanity:100, salaryMult:0.8, desc:'Part-time job, lowest pay. Food is stocked for now. Money is the grind.' },
      { id:'worker',   emoji:'🏗️', name:'Shift Worker',    money:500, food:70,  sanity:80,  salaryMult:1.2, desc:'Good pay, irregular hours. Food drops faster. Bills hit harder.' },
      { id:'remote',   emoji:'💻', name:'Remote Worker',   money:450, food:85,  sanity:95,  salaryMult:1.0, desc:'Comfortable start but isolated. Sanity is precious when you never leave.' },
      { id:'freelance',emoji:'🎨', name:'Freelancer',      money:200, food:75,  sanity:85,  salaryMult:1.3, desc:'Feast or famine. Highest pay potential but income is unpredictable. High risk, high reward.' },
    ];

    function renderArchetypes() {
      const saved = localStorage.getItem('stm_archetype') || 'grad';
      const list  = document.getElementById('archetype-list');
      list.innerHTML = '';
      ARCHETYPES.forEach(a => {
        const div = document.createElement('div');
        div.className = 'archetype-card' + (a.id === saved ? ' selected' : '');
        div.innerHTML = `
          <div class="arch-emoji">${a.emoji}</div>
          <div style="flex:1;">
            <div class="arch-name">${a.name}${a.id === saved ? ' ✓' : ''}</div>
            <div class="arch-desc">${a.desc}</div>
            <div class="arch-stats">
              <span class="stat-money">💵 $${a.money}</span>
              <span class="stat-food">🍕 ${a.food}% food</span>
              <span class="stat-sanity">🧠 ${a.sanity}% sanity</span>
              <span class="stat-pay">💼 ${a.salaryMult >= 1 ? '+' : ''}${Math.round((a.salaryMult-1)*100)}% pay</span>
            </div>
          </div>`;
        div.onclick = () => {
          localStorage.setItem('stm_archetype', a.id);
          playSfx('click');
          renderArchetypes();
        };
        list.appendChild(div);
      });
    }
    renderArchetypes();
  </script>
</body>
</html>
